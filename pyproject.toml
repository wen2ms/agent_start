[project]
name = "agent-start"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "dashscope>=1.26.5",
    "jq>=1.12.0",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.4.1",
    "openai>=2.50.0",
    "pypdf>=6.16.0",
    "streamlit>=1.61.1",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "E203",
  "E266",
  "E501",
  "D",
  "T201",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
