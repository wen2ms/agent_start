[project]
name = "agent-start"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dashscope>=1.26.5",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.4.1",
    "openai>=2.50.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "E203",
  "E266",
  "E501",
  "D",
  "T201",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
